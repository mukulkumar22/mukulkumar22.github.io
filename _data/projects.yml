- title: "Ask: AI Assistant for Enterprise"
  year: 2025
  description: >-
    ReAct-based LLM agent system at AI71 with structured reasoning, dynamic tool
    orchestration, prompt and KV caching (18-35% TTFT reduction), and a full
    evaluation framework with MLflow tracking and CI/CD integration.
  links:
    - label: ASK71
