<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}" />
    <link rel="apple-touch-icon" href="{{ '/assets/favicon.png' | relative_url }}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
    {% seo %}
  </head>

  <body>
    <a href="#main" class="skip">Skip to content</a>

    <div class="layout">
      {% include sidebar.html %}

      <main id="main" class="content">
        {{ content }}

        <footer class="site-footer">
          <p>
            © <span id="year"></span> {{ site.author }}
            {% if page.layout != 'post' %} · Last updated <time datetime="2026-05-25">May 2026</time>{% endif %}
          </p>
        </footer>
      </main>
    </div>

    <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
  </body>
</html>
